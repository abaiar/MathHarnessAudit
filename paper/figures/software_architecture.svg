<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">MathHarnessAudit evidence-preserving architecture</title>
  <desc id="desc">Native or canonical traces flow through fidelity-aware adapters, a canonical evidence ledger, deterministic scoring, denominator-aware audit, and reproducible outputs. Reference answers enter scoring through an audit-only boundary. Reproducibility controls span every layer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker>
    <marker id="goldArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#c2410c"/></marker>
    <style>
      .title{font:700 32px Arial,sans-serif;fill:#0f172a}.subtitle{font:20px Arial,sans-serif;fill:#475569}
      .step{font:700 17px Arial,sans-serif;letter-spacing:1px;fill:#475569}.head{font:700 23px Arial,sans-serif;fill:#0f172a}
      .body{font:19px Arial,sans-serif;fill:#1e293b}.small{font:17px Arial,sans-serif;fill:#475569}.box{stroke:#334155;stroke-width:2.2;rx:15}
      .flow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.gold{stroke:#c2410c;stroke-width:3;stroke-dasharray:7 6;fill:none;marker-end:url(#goldArrow)}
    </style>
  </defs>
  <rect width="1400" height="790" fill="#fff"/>
  <text x="40" y="50" class="title">MathHarnessAudit: evidence-preserving audit architecture</text>
  <text x="40" y="82" class="subtitle">A read-only translation and analysis path; unavailable evidence is never reconstructed.</text>
  <rect x="35" y="125" width="210" height="400" class="box" fill="#f1f5f9"/>
  <text x="55" y="158" class="step">INPUT</text><text x="55" y="194" class="head">Audited traces</text>
  <text x="55" y="238" class="body">Native harness logs</text><text x="55" y="273" class="body">Canonical JSON</text><text x="55" y="308" class="body">Conservative OTel</text>
  <line x1="55" y1="345" x2="225" y2="345" stroke="#cbd5e1" stroke-width="2"/>
  <text x="55" y="382" class="small">No harness changes</text><text x="55" y="414" class="small">No hidden-CoT recovery</text><text x="55" y="446" class="small">Observed structure only</text>
  <rect x="275" y="125" width="225" height="400" class="box" fill="#dbeafe"/>
  <text x="295" y="158" class="step">LAYER 1</text><text x="295" y="194" class="head">Adapt + validate</text>
  <text x="295" y="238" class="body">Versioned adapters</text><text x="295" y="273" class="body">Fidelity A / B / C</text><text x="295" y="308" class="body">Schema + references</text><text x="295" y="343" class="body">Acyclic provenance</text>
  <rect x="295" y="383" width="185" height="92" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="315" y="418" class="head">Semantic gate</text><text x="315" y="451" class="small">gold isolation + IDs</text>
  <rect x="530" y="125" width="250" height="400" class="box" fill="#ecfdf5"/>
  <text x="550" y="158" class="step">LAYER 2</text><text x="550" y="194" class="head">Canonical episode</text>
  <text x="550" y="238" class="body">sources + observations</text><text x="550" y="273" class="body">evidence + decisions</text><text x="550" y="308" class="body">typed provenance edges</text><text x="550" y="343" class="body">final output + cost</text>
  <rect x="550" y="383" width="210" height="92" rx="10" fill="#fff" stroke="#10b981" stroke-width="2"/>
  <text x="570" y="418" class="small">not called · failed</text><text x="570" y="451" class="small">timeout · not observable</text>
  <rect x="810" y="125" width="220" height="400" class="box" fill="#fef3c7"/>
  <text x="830" y="158" class="step">LAYER 3</text><text x="830" y="194" class="head">Score</text>
  <text x="830" y="238" class="body">Exact / numeric</text><text x="830" y="273" class="body">Categorical</text><text x="830" y="308" class="body">Restricted symbolic</text>
  <line x1="830" y1="345" x2="1010" y2="345" stroke="#eab308" stroke-width="2"/>
  <text x="830" y="382" class="small">correct · incorrect</text><text x="830" y="414" class="small">abstain · unscorable</text><text x="830" y="456" class="small">Human labels separate</text>
  <rect x="1060" y="125" width="305" height="400" class="box" fill="#fee2e2"/>
  <text x="1080" y="158" class="step">LAYERS 4–5</text><text x="1080" y="194" class="head">Audit + publish</text>
  <text x="1080" y="238" class="body">Availability before accuracy</text><text x="1080" y="273" class="body">Dependence + co-failure</text><text x="1080" y="308" class="body">Repair / harm + adoption</text><text x="1080" y="343" class="body">Repetition + cost</text>
  <rect x="1080" y="378" width="265" height="97" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
  <text x="1100" y="413" class="small">CSV / SVG / HTML / JSON</text><text x="1100" y="446" class="small">hashed manifests · no ranking</text>
  <path d="M245 325 L275 325" class="flow"/><path d="M500 325 L530 325" class="flow"/><path d="M780 325 L810 325" class="flow"/><path d="M1030 325 L1060 325" class="flow"/>
  <line x1="530" y1="575" x2="1030" y2="575" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="545" y="563" class="small" fill="#9a3412">solver-visible above · audit-only below</text>
  <rect x="580" y="603" width="330" height="76" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="605" y="637" class="head">Reference answer</text><text x="605" y="665" class="small">enters deterministic scoring only</text>
  <path d="M910 641 C970 641 920 580 920 525" class="gold"/>
  <rect x="35" y="714" width="1330" height="56" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="57" y="749" class="body">Cross-cutting controls: schema + versions + registered panels + configuration/seed + source and artifact hashes</text>
</svg>
