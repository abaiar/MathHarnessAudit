<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720" role="img" aria-labelledby="title desc">
  <title id="title">Provider-free MathHarnessAudit reproduction workflow</title>
  <desc id="desc">A synthetic trace is adapted and validated, deterministically scored, and audited. The scored episode can also feed normalized Parquet export or registered publication. The one-episode demonstration verifies installation, contracts, and lineage rather than model performance.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 31px Arial,sans-serif;fill:#0f172a}.subtitle{font:20px Arial,sans-serif;fill:#475569}.step{font:700 17px Arial,sans-serif;letter-spacing:1px;fill:#475569}
      .head{font:700 23px Arial,sans-serif;fill:#0f172a}.body{font:19px Arial,sans-serif;fill:#1e293b}.small{font:17px Arial,sans-serif;fill:#475569}.mono{font:17px Consolas,monospace;fill:#0f172a}
      .box{stroke:#334155;stroke-width:2.2;rx:15}.flow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.branch{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#blueArrow)}
    </style>
  </defs>
  <rect width="1300" height="720" fill="#fff"/>
  <text x="35" y="48" class="title">Provider-free five-minute reproduction path</text>
  <text x="35" y="80" class="subtitle">One synthetic episode checks installation, contracts, denominators, and lineage—not model performance.</text>
  <rect x="35" y="125" width="245" height="285" class="box" fill="#f1f5f9"/>
  <text x="55" y="158" class="step">1 · INPUT</text><text x="55" y="194" class="head">Safe fixture</text>
  <text x="55" y="238" class="body">ICMA-shaped JSON</text><text x="55" y="273" class="body">No provider call</text><text x="55" y="308" class="body">No API key</text><text x="55" y="343" class="body">No private trace</text>
  <rect x="315" y="125" width="300" height="285" class="box" fill="#dbeafe"/>
  <text x="335" y="158" class="step">2 · TRANSLATE</text><text x="335" y="194" class="head">Adapt + validate</text>
  <text x="335" y="238" class="body">Adapter mapping</text><text x="335" y="273" class="body">Schema + references</text><text x="335" y="308" class="body">Gold isolation</text>
  <rect x="350" y="338" width="230" height="47" rx="9" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="378" y="369" class="mono">canonical.jsonl</text>
  <rect x="650" y="125" width="270" height="285" class="box" fill="#ecfdf5"/>
  <text x="670" y="158" class="step">3 · SCORE</text><text x="670" y="194" class="head">Deterministic rules</text>
  <text x="670" y="238" class="body">Exact / numeric</text><text x="670" y="273" class="body">Categorical / symbolic</text><text x="670" y="308" class="body">Explicit unscorable</text>
  <rect x="685" y="338" width="200" height="47" rx="9" fill="#fff" stroke="#10b981" stroke-width="2"/><text x="715" y="369" class="mono">scored.jsonl</text>
  <rect x="955" y="125" width="310" height="285" class="box" fill="#fef3c7"/>
  <text x="975" y="158" class="step">4 · AUDIT</text><text x="975" y="194" class="head">Inspect results</text>
  <text x="975" y="238" class="body">Availability first</text><text x="975" y="273" class="body">Paired cells + cost</text><text x="975" y="308" class="body">Explicit denominators</text>
  <text x="975" y="354" class="mono">report.json · index.html</text><text x="975" y="386" class="small">Undefined phi stays undefined.</text>
  <path d="M280 267 L315 267" class="flow"/><path d="M615 267 L650 267" class="flow"/><path d="M920 267 L955 267" class="flow"/>
  <path d="M785 385 L785 462 L340 462 L340 510" class="branch"/><path d="M785 462 L975 462 L975 510" class="branch"/>
  <rect x="70" y="510" width="540" height="125" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="92" y="544" class="step" fill="#1d4ed8">OPTIONAL NORMALIZED REUSE</text><text x="92" y="580" class="head">export-parquet</text>
  <text x="92" y="611" class="small">Seven entity tables from scored canonical episodes</text>
  <rect x="650" y="510" width="615" height="125" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="672" y="544" class="step" fill="#1d4ed8">OPTIONAL REGISTERED PUBLICATION</text><text x="672" y="580" class="head">publish --config</text>
  <text x="672" y="611" class="small">Tables, accessible figures, and content-linked manifest</text>
  <rect x="35" y="665" width="1230" height="40" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="55" y="691" class="small">Fixed episodes + configuration/seed + tool version → the same analytical content; manifests bind the lineage.</text>
</svg>
