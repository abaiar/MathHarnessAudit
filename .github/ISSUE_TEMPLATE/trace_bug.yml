name: Trace-format bug
description: Report incorrect ingestion, missingness, provenance or selection semantics.
title: "[trace bug] "
labels: ["bug", "trace-format"]
body:
  - type: input
    id: version
    attributes:
      label: MathHarnessAudit and adapter versions
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed canonical behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected source semantics and evidence
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal synthetic or explicitly de-identified reproducer
      description: Never attach secrets, private traces, chain-of-thought or restricted benchmark text.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I verified that this report contains no credentials or private/restricted trace content.
          required: true
