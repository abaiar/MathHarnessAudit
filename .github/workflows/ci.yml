name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python }}
      - name: Verify lock consistency
        run: uv lock --check
      - name: Lint
        run: uv run --frozen --python ${{ matrix.python }} --extra dev --extra parquet ruff check src tests examples/run_demo.py
      - name: Test
        run: uv run --frozen --python ${{ matrix.python }} --extra dev --extra parquet pytest
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv run --frozen --python ${{ matrix.python }} --all-extras --with pip-audit==2.10.1 pip-audit --progress-spinner off
      - name: Build distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv build
